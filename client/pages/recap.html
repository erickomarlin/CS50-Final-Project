<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Recap — Daily Calorie Buddy</title>
    <link href="/css/output.css" rel="stylesheet" />
  </head>
  <body class="bg-brand min-h-screen flex items-center justify-center p-4">
    <div class="bg-surface border border-line rounded-2xl p-5 w-full max-w-sm">
      <h1 class="text-white text-lg font-medium mb-4">Recap</h1>

      <p class="text-gold text-sm font-medium mb-2">Food and drinks</p>
      <div
        id="foodListEl"
        class="bg-brand border border-line rounded-lg mb-2 overflow-hidden"
      ></div>
      <div class="flex justify-between text-xs text-gray-500 mb-5">
        <span>Food total</span><span id="foodTotalEl"></span>
      </div>

      <p class="text-gold text-sm font-medium mb-2">Activity</p>
      <div
        id="activityListEl"
        class="bg-brand border border-line rounded-lg mb-2 overflow-hidden"
      ></div>
      <div class="flex justify-between text-xs text-gray-500 mb-5">
        <span>Activity total</span><span id="activityTotalEl"></span>
      </div>

      <button
        id="submitBtn"
        type="button"
        class="w-full bg-gold text-brand rounded-lg py-2 text-sm font-medium mb-2"
      >
        Submit
      </button>
      <button
        id="backBtn"
        type="button"
        class="w-full border border-line text-white rounded-lg py-2 text-sm"
      >
        Back
      </button>
    </div>

    <script src="/js/api.js"></script>
    <script src="/js/recap.js"></script>
  </body>
</html>
